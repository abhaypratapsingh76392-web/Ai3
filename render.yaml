services:
  - type: web
    name: freemodel-vip
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PATH
        value: admin
      - key: FIREBASE_DB_URL
        value: https://luckymall-23b3f-default-rtdb.firebaseio.com
      - key: DB_MODE
        value: auto
      - key: FB_API_KEY
        sync: false
      - key: FB_AUTH_DOMAIN
        value: luckymall-23b3f.firebaseapp.com
      - key: FB_PROJECT_ID
        value: luckymall-23b3f
      - key: FB_APP_ID
        sync: false
      - key: FB_SENDER_ID
        sync: false
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

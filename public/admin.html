<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070c" />
<meta name="robots" content="noindex,nofollow" />
<title>Admin Console — FreeModel VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/theme.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b1120'/%3E%3Cpath d='M16 6l2.9 7.1L26 16l-7.1 2.9L16 26l-2.9-7.1L6 16l7.1-2.9L16 6z' fill='%23f5c76a'/%3E%3C/svg%3E" />
<style>
html,body{height:100%;overflow:hidden}
/* ---------------------------- LOGIN ---------------------------- */
.a-login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.a-card{width:min(420px,100%);padding:34px 30px;border-radius:24px;background:linear-gradient(180deg,rgba(15,23,39,.95),rgba(7,11,20,.97));border:1px solid var(--line-2);box-shadow:var(--shadow)}
.a-logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#f8d98d,#e0a94a);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 18px 40px -18px rgba(245,199,106,.9)}
.a-logo svg{width:26px;height:26px;color:#2a1c02}
.a-card h1{font-size:23px;letter-spacing:-.03em;margin-bottom:7px}
.a-card p.sub{color:var(--muted);font-size:13.6px;margin-bottom:22px}
.a-err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}

/* ---------------------------- SHELL ---------------------------- */
.a-shell{display:flex;height:100dvh;width:100%}
.a-side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,rgba(10,16,28,.98),rgba(5,8,14,1));border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .28s}
.a-brand{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;font-weight:850;font-size:14.5px}
.a-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#f8d98d,#e0a94a);display:grid;place-items:center;flex:0 0 auto}
.a-mark svg{width:17px;height:17px;color:#2a1c02}
.a-nav{flex:1;overflow-y:auto;padding:6px 8px}
.a-nav button{
  width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;
  border:none;background:transparent;color:var(--muted);font-size:13.2px;font-weight:650;
  cursor:pointer;text-align:left;transition:.15s;font-family:inherit;margin-bottom:2px;
}
.a-nav button svg{width:16px;height:16px;flex:0 0 auto}
.a-nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.a-nav button.active{background:rgba(245,199,106,.14);color:#ffe2a8;box-shadow:inset 2px 0 0 var(--gold)}
.a-nav .n-badge{margin-left:auto;background:rgba(251,113,133,.2);color:#ffb4c0;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px}
.a-side-foot{padding:10px;border-top:1px solid var(--line)}

.a-main{flex:1;display:flex;flex-direction:column;min-width:0}
.a-top{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(6,10,18,.7);backdrop-filter:blur(14px);flex:0 0 auto}
.a-top h2{font-size:15.5px;letter-spacing:-.02em}
.a-body{flex:1;overflow-y:auto;padding:20px}
.a-wrap{max-width:1280px;margin:0 auto}

/* ---------------------------- CARDS ---------------------------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.kpi{padding:16px 17px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(165deg,rgba(16,24,40,.8),rgba(8,13,23,.86));position:relative;overflow:hidden}
.kpi .k-l{font-size:10.8px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:800}
.kpi .k-v{font-size:25px;font-weight:900;letter-spacing:-.04em;margin-top:5px}
.kpi .k-s{font-size:11.4px;color:var(--dim);margin-top:2px}
.kpi .k-ico{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(99,102,241,.15);color:#a5b4fc}
.kpi .k-ico svg{width:15px;height:15px}
.kpi.gold .k-ico{background:rgba(245,199,106,.16);color:var(--gold)}
.kpi.ok .k-ico{background:rgba(52,211,153,.16);color:#6ee7b7}
.kpi.err .k-ico{background:rgba(251,113,133,.16);color:#ffb4c0}

.panel{border:1px solid var(--line);border-radius:16px;background:rgba(10,16,28,.6);overflow:hidden}
.p-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.p-title{font-size:13.8px;font-weight:750}
.p-body{padding:16px}
.p-body.tight{padding:0}

.chart{height:150px;display:flex;align-items:flex-end;gap:5px;padding:10px 4px 0}
.chart .bar{flex:1;background:linear-gradient(180deg,#6366f1,#22d3ee);border-radius:4px 4px 2px 2px;min-height:3px;position:relative;transition:height .4s;opacity:.85}
.chart .bar:hover{opacity:1}
.chart-x{display:flex;gap:5px;padding:5px 4px 0}
.chart-x span{flex:1;text-align:center;font-size:9px;color:var(--dim);overflow:hidden}

/* ---------------------------- TABLES --------------------------- */
.mini{font-size:11.8px;color:var(--dim)}
.chipx{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:10.6px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.avatar-s{width:27px;height:27px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:0 0 auto;overflow:hidden}
.avatar-s img{width:100%;height:100%;object-fit:cover}
.u-cell{display:flex;align-items:center;gap:9px;min-width:150px}
.u-cell .u-n{font-size:12.8px;font-weight:700;line-height:1.25}
.u-cell .u-e{font-size:10.8px;color:var(--dim)}

/* ---------------------------- FORMS ---------------------------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.f-row{display:flex;flex-direction:column;gap:6px}
.f-row label{font-size:11.6px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input.search{flex:1;min-width:170px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:rgba(4,8,15,.7);color:var(--txt);font-size:13px;font-family:inherit}
.toolbar input.search:focus{outline:none;border-color:rgba(99,102,241,.6)}

/* provider row */
.prov{padding:13px 15px;border-bottom:1px solid rgba(120,150,200,.1);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prov:last-child{border:0}
.prov .pv-n{font-size:13.2px;font-weight:750}
.prov .pv-m{font-size:11.4px;color:var(--dim);font-family:var(--mono)}
.prov .pv-bar{width:96px;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.prov .pv-bar i{display:block;height:100%;background:var(--grad)}
.prov .pv-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* toast host override for admin */
.a-login-wrap{display:none}
@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2{grid-template-columns:1fr}
  .a-side{position:fixed;top:0;left:0;bottom:0;transform:translateX(-102%)}
  .a-side.open{transform:none}
  .a-burger{display:grid !important}
  .form-grid{grid-template-columns:1fr}
}
.a-burger{display:none;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;place-items:center}
.a-burger svg{width:17px;height:17px}
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div class="a-login" id="loginView">
  <div class="a-card">
    <div class="a-logo" id="aLogo"></div>
    <h1>Admin console</h1>
    <p class="sub">Restricted area. Enter the admin password to manage users, APIs, plans and payments.</p>
    <div class="field">
      <label class="label" for="adminPass">Admin password</label>
      <input class="input" id="adminPass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="a-err" id="loginErr"></div>
    <button class="btn btn-gold btn-block btn-lg" id="loginBtn">Unlock console</button>
    <p class="hint center" style="margin-top:16px">All attempts are logged with IP address.</p>
  </div>
</div>

<!-- ============================== SHELL ============================== -->
<div class="a-shell" id="shell" style="display:none">
  <aside class="a-side" id="aSide">
    <div class="a-brand"><span class="a-mark" id="aMark"></span><span>Admin Console</span></div>
    <nav class="a-nav" id="aNav"></nav>
    <div class="a-side-foot">
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="a-main">
    <div class="a-top">
      <button class="a-burger" id="aBurger"></button>
      <h2 id="pageTitle">Dashboard</h2>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <span class="badge" id="dbBadge">storage</span>
        <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div class="a-body"><div class="a-wrap" id="aBody"></div></div>
  </main>
</div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/core.js"></script>
<script>
(function () {
  'use strict';
  const { api, toast, escapeHtml, escapeAttr, num, money, timeAgo, fmtDate, confirm: confirmBox, store: ls, modal } = APP;

  let adminToken = ls.get('adminToken', '');
  let page = 'dashboard';
  let cache = {};

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  $('#aLogo').innerHTML = svgIcon('shield');
  $('#aMark').innerHTML = svgIcon('spark');
  $('#aBurger').innerHTML = svgIcon('menu');
  $('#refreshBtn').innerHTML = svgIcon('refresh');

  function adminApi(path, opts) {
    if (!adminToken) return Promise.reject(new Error('Not signed in'));
    return api('/admin' + path, opts);
  }

  /* ------------------------------- login -------------------------------- */
  async function tryLogin() {
    const pass = $('#adminPass').value;
    if (!pass) return ($('#loginErr').textContent = 'Enter the admin password.');
    const btn = $('#loginBtn');
    APP.busy(btn, true);
    try {
      const out = await api('/admin/login', { body: { password: pass } });
      adminToken = out.adminToken;
      ls.set('adminToken', adminToken);
      enter();
    } catch (e) {
      $('#loginErr').textContent = e.message;
      APP.busy(btn, false);
    }
  }
  $('#loginBtn').onclick = tryLogin;
  $('#adminPass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryLogin();
  });

  function enter() {
    $('#loginView').style.display = 'none';
    $('#shell').style.display = 'flex';
    buildNav();
    go('dashboard');
  }

  $('#logoutBtn').onclick = () => {
    adminToken = '';
    ls.del('adminToken');
    location.reload();
  };

  /* -------------------------------- nav --------------------------------- */
  const NAV = [
    ['dashboard', 'chart', 'Dashboard'],
    ['users', 'users', 'Users'],
    ['sessions', 'key', 'Sessions & tokens'],
    ['providers', 'plug', 'API providers'],
    ['models', 'layers', 'Models'],
    ['plans', 'crown', 'Plans'],
    ['payments', 'card', 'Payments'],
    ['chats', 'chat', 'All chats'],
    ['settings', 'settings', 'Settings'],
    ['logs', 'shield', 'Logs']
  ];

  function buildNav() {
    $('#aNav').innerHTML = NAV.map(
      ([k, ic, label]) =>
        `<button data-page="${k}" class="${k === page ? 'active' : ''}">${svgIcon(ic)}<span>${label}</span><span class="n-badge hidden" data-badge="${k}"></span></button>`
    ).join('');
    $$('#aNav button').forEach((b) => {
      b.onclick = () => {
        go(b.dataset.page);
        $('#aSide').classList.remove('open');
      };
    });
  }

  $('#aBurger').onclick = () => $('#aSide').classList.toggle('open');
  $('#refreshBtn').onclick = () => go(page, true);

  function setTitle(t) {
    $('#pageTitle').textContent = t;
    $$('#aNav button').forEach((b) => b.classList.toggle('active', b.dataset.page === page));
  }

  function pendingBadge(n) {
    const el = document.querySelector('[data-badge="payments"]');
    if (!el) return;
    el.textContent = n;
    el.classList.toggle('hidden', !n);
  }

  /* ------------------------------ routing ------------------------------- */
  async function go(p, force) {
    page = p;
    const titles = {
      dashboard: 'Dashboard', users: 'User management', sessions: 'Sessions & tokens',
      providers: 'API providers', models: 'Models', plans: 'Plans & pricing',
      payments: 'Payments', chats: 'All chats', settings: 'Settings', logs: 'Activity logs'
    };
    setTitle(titles[p] || 'Dashboard');
    $('#aBody').innerHTML = `<div class="skel" style="height:120px;margin-bottom:14px"></div><div class="skel" style="height:280px"></div>`;
    try {
      if (p === 'dashboard') return renderDashboard();
      if (p === 'users') return renderUsers();
      if (p === 'sessions') return renderSessions();
      if (p === 'providers') return renderProviders();
      if (p === 'models') return renderModels();
      if (p === 'plans') return renderPlans();
      if (p === 'payments') return renderPayments();
      if (p === 'chats') return renderChats();
      if (p === 'settings') return renderSettings();
      if (p === 'logs') return renderLogs();
    } catch (e) {
      $('#aBody').innerHTML = `<div class="panel"><div class="p-body"><p class="hint">${escapeHtml(e.message)}</p>
        <button class="btn btn-primary btn-sm" onclick="location.reload()">Reload</button></div></div>`;
    }
  }

  /* ------------------------------ dashboard ----------------------------- */
  async function renderDashboard() {
    const d = await adminApi('/stats');
    cache.stats = d;
    const t = d.totals;
    pendingBadge(t.pendingPayments);
    $('#dbBadge').innerHTML = `<span class="dot ${t.firebaseOk ? '' : 'warn'}"></span>${escapeHtml(t.dbBackend)}`;
    const maxUsers = Math.max(1, ...d.series.map((s) => s.users));
    const maxRev = Math.max(1, ...d.series.map((s) => s.revenue));

    $('#aBody').innerHTML = `
      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><span class="k-ico">${svgIcon('users')}</span><div class="k-l">Total users</div><div class="k-v">${num(t.users)}</div><div class="k-s">+${t.newUsers24h} in 24h</div></div>
        <div class="kpi ok"><span class="k-ico">${svgIcon('chat')}</span><div class="k-l">Messages</div><div class="k-v">${num(t.messages)}</div><div class="k-s">${num(t.chats)} chats</div></div>
        <div class="kpi gold"><span class="k-ico">${svgIcon('coins')}</span><div class="k-l">Tokens spent</div><div class="k-v">${num(t.tokensSpent)}</div><div class="k-s">${num(t.tokensIssued)} issued</div></div>
        <div class="kpi ${t.pendingPayments ? 'err' : 'ok'}"><span class="k-ico">${svgIcon('card')}</span><div class="k-l">Revenue</div><div class="k-v">${money(t.revenue)}</div><div class="k-s">${t.pendingPayments} pending · ${num(t.paymentsCount)} total</div></div>
      </div>

      <div class="grid g2" style="margin-bottom:14px">
        <div class="panel">
          <div class="p-head"><span class="p-title">New users · last 14 days</span></div>
          <div class="p-body">
            <div class="chart">${d.series.map((s) => `<div class="bar" style="height:${Math.max(3, (s.users / maxUsers) * 100)}%" title="${s.day}: ${s.users} users"></div>`).join('')}</div>
            <div class="chart-x">${d.series.map((s) => `<span>${s.day.slice(3)}</span>`).join('')}</div>
          </div>
        </div>
        <div class="panel">
          <div class="p-head"><span class="p-title">Revenue · last 14 days</span></div>
          <div class="p-body">
            <div class="chart">${d.series.map((s) => `<div class="bar" style="height:${Math.max(3, (s.revenue / maxRev) * 100)}%;background:linear-gradient(180deg,#f8d98d,#e0a94a)" title="₹${s.revenue}"></div>`).join('')}</div>
            <div class="chart-x">${d.series.map((s) => `<span>${s.day.slice(3)}</span>`).join('')}</div>
          </div>
        </div>
      </div>

      <div class="grid g2">
        <div class="panel">
          <div class="p-head"><span class="p-title">Provider pool health</span>
            <button class="btn btn-ghost btn-xs" style="margin-left:auto" data-go-prov>Manage</button></div>
          <div class="p-body tight">
            ${d.providers.length ? d.providers.map(providerRow).join('') : '<p class="hint" style="padding:16px">No providers configured yet.</p>'}
          </div>
        </div>

        <div class="panel">
          <div class="p-head"><span class="p-title">Newest users</span>
            <button class="btn btn-ghost btn-xs" style="margin-left:auto" data-go-users>All users</button></div>
          <div class="p-body tight">
            ${d.recentUsers.map((u) => `<div class="prov">
              <div class="avatar-s">${u.avatar ? `<img src="${escapeAttr(u.avatar)}" />` : escapeHtml((u.name || 'U')[0].toUpperCase())}</div>
              <div style="min-width:0"><div class="pv-n ellipsis" style="max-width:180px">${escapeHtml(u.name)}</div>
              <div class="pv-m">${escapeHtml(u.email)}</div></div>
              <div class="pv-acts"><span class="chipx" style="background:rgba(99,102,241,.16);color:#c7d0ff">${num(u.tokens)} t</span>
              <span class="mini">${timeAgo(u.createdAt)}</span></div>
            </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <div class="p-head"><span class="p-title">Recent payments</span>
          <button class="btn btn-ghost btn-xs" style="margin-left:auto" data-go-pay>Open payments</button></div>
        <div class="p-body tight">
          ${d.recentPayments.length ? `<div class="tbl-wrap" style="border:0">
            <table class="table"><thead><tr><th>User</th><th>Plan</th><th>Amount</th><th>Mode</th><th>Status</th><th>When</th></tr></thead>
            <tbody>${d.recentPayments.map((p) => `<tr>
              <td><div class="u-cell"><div><div class="u-n">${escapeHtml(p.userName || '—')}</div><div class="u-e">${escapeHtml(p.userEmail || '')}</div></div></div></td>
              <td>${escapeHtml(p.planName)}</td><td>${money(p.amount)}</td><td>${escapeHtml(p.mode)}</td>
              <td>${statusChip(p.status)}</td><td class="mini">${timeAgo(p.createdAt)}</td></tr>`).join('')}</tbody></table></div>`
            : '<p class="hint" style="padding:16px">No payments yet.</p>'}
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <div class="p-head"><span class="p-title">System</span></div>
        <div class="p-body">
          <div class="form-grid">
            <div class="f-row"><label>Storage backend</label><div class="mono small">${escapeHtml(t.dbBackend)} ${t.firebaseOk ? '✓ connected' : '⚠ fallback'}</div></div>
            <div class="f-row"><label>Uptime</label><div class="mono small">${Math.floor(t.uptime / 3600)}h ${Math.floor((t.uptime % 3600) / 60)}m</div></div>
            <div class="f-row"><label>Providers live</label><div class="mono small">${t.providersLive} / ${t.providers}</div></div>
            <div class="f-row"><label>Last storage error</label><div class="mono small">${escapeHtml(t.lastStoreError || 'none')}</div></div>
          </div>
          <div class="row" style="margin-top:14px;gap:8px">
            <button class="btn btn-ghost btn-sm" id="flushBtn">${svgIcon('refresh')} Force save to storage</button>
          </div>
        </div>
      </div>`;

    $$('[data-go-prov]').forEach((b) => (b.onclick = () => go('providers')));
    $$('[data-go-users]').forEach((b) => (b.onclick = () => go('users')));
    $$('[data-go-pay]').forEach((b) => (b.onclick = () => go('payments')));
    $('#flushBtn').onclick = async (e) => {
      APP.busy(e.currentTarget, true);
      try {
        const out = await adminApi('/flush', { method: 'POST', body: {} });
        toast(out.firebaseOk ? 'Saved to Firebase.' : 'Saved locally (Firebase unreachable).', out.firebaseOk ? 'ok' : 'warn');
      } catch (err) {
        toast(err.message, 'err');
      }
      APP.busy(e.currentTarget, false);
    };
  }

  function providerRow(p) {
    const pct = p.requestLimit > 0 ? Math.min(100, (p.requestsUsed / p.requestLimit) * 100) : 0;
    return `<div class="prov">
      <span class="dot ${p.usable ? '' : p.coolingDown ? 'warn' : 'err'}"></span>
      <div style="min-width:0;flex:1">
        <div class="pv-n">${escapeHtml(p.name)} <span class="mini">· ${escapeHtml(p.model)}</span></div>
        <div class="pv-m">${p.requestsUsed}${p.requestLimit > 0 ? '/' + p.requestLimit : ''} requests ${p.errors ? '· ' + p.errors + ' errors' : ''}</div>
      </div>
      <div class="pv-bar"><i style="width:${pct}%;background:${pct > 85 ? '#fb7185' : 'var(--grad)'}"></i></div>
      <span class="chipx" style="background:rgba(255,255,255,.07);color:${p.usable ? '#6ee7b7' : '#ffb4c0'}">${p.usable ? 'live' : p.enabled ? 'cooling' : 'off'}</span>
    </div>`;
  }

  function statusChip(s) {
    const map = {
      success: ['badge-ok', 'active'],
      pending: ['badge-warn', 'pending'],
      rejected: ['badge-err', 'rejected'],
      created: ['badge', 'created']
    };
    const [cls, label] = map[s] || ['badge', s];
    return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
  }

            </tr>`).join('')}

    $('#grantAll').onclick = () => {
      modal({
        title: 'Grant tokens to every user',
        body: `<div class="field"><label class="label">Tokens per user</label><input class="input" id="gtAmt" type="number" value="1000" /></div>
               <p class="hint">This adds the amount to all ${d.total} users instantly.</p>`,
        footer: `<button class="btn btn-ghost" data-c>Cancel</button><button class="btn btn-primary" data-ok>Grant</button>`,
        onOpen(el, close) {
          el.querySelector('[data-c]').onclick = close;
          el.querySelector('[data-ok]').onclick = async () => {
            const amt = Number(el.querySelector('#gtAmt').value) || 0;
            if (!amt) return toast('Enter an amount.', 'err');
            const ok = await confirmBox(`Add ${amt} tokens to all ${d.total} users?`, { ok: 'Yes, grant' });
            if (!ok) return;
            let done = 0;
            for (const u of d.users) {
              try {
                await adminApi('/users/' + u.id, { method: 'PATCH', body: { addTokens: amt } });

            close();
            toast(`Granted to ${done} users.`, 'ok');

        const u = d.users.find((x) => x.id === b.dataset.del);
        const ok = await confirmBox(`Delete ${u.email}? All chats and sessions go with it.`, { ok: 'Delete user', danger: true });
        if (!ok) return;
        try {
          await adminApi('/users/' + u.id, { method: 'DELETE' });
          toast('User deleted.', 'ok');
          renderUsers($('#uSearch').value, $('#uStatus').value);
        } catch (e) {
          toast(e.message, 'err');
        }
      };
    });
  }

        ls.del('adminToken');
      }
    }
    $('#loginView').style.display = 'grid';
  })();
})();
</script>
